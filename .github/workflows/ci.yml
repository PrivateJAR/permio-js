name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      matrix:
        # vitest needs Node 20+; Node 18 is covered by the dist smoke test below.
        node: [20, 22, 24]
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node scripts/smoke-dist.mjs && node scripts/smoke-dist.cjs
      - name: Check the packed files
        if: matrix.node == 24
        run: |
          npm pack --dry-run --json | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path);
            const bad = files.filter((f) => !/^(dist\/|README\.md$|LICENSE$|package\.json$)/.test(f));
            if (bad.length) { console.error("unexpected files in package:", bad); process.exit(1); }
            console.log(files.join("\n"));
          '

  node18:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      - run: node scripts/smoke-dist.mjs && node scripts/smoke-dist.cjs

  # Runs test/live.test.ts against the dev API (DEV_BASE_URL) when the
  # PERMIO_DEV_API_KEY secret is available, and is skipped otherwise (for
  # example on pull requests from forks). The test writes fixed sdk-it-js-*
  # IDs, so runs are serialised.
  integration:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    concurrency:
      group: permio-js-integration
      cancel-in-progress: false
    steps:
      - name: Check for the dev API key
        id: key
        env:
          HAS_KEY: ${{ secrets.PERMIO_DEV_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::PERMIO_DEV_API_KEY is not available; skipping the integration test."
          fi
          echo "enabled=$HAS_KEY" >> "$GITHUB_OUTPUT"
      - uses: useblacksmith/checkout@v1
        if: steps.key.outputs.enabled == 'true'
      - uses: actions/setup-node@v6
        if: steps.key.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.key.outputs.enabled == 'true'
        run: npm ci
      - name: Integration test against the dev API
        if: steps.key.outputs.enabled == 'true'
        env:
          PERMIO_API_KEY: ${{ secrets.PERMIO_DEV_API_KEY }}
        run: |
          npx vitest run test/live.test.ts --reporter=default --reporter=json --outputFile.json=live.json
          # Fail if the suite was skipped rather than run.
          node -e 'const r = require("./live.json"); if (!(r.numPassedTests > 0)) { console.error("integration test did not run"); process.exit(1); }'
