name: Generated code
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Regenerates src/gen/ from the proto commit pinned in .proto-version and
  # fails if the committed code differs, so src/gen/ is never edited by hand
  # and always matches a real proto release.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned proto version
        id: pin
        env:
          HAS_KEY: ${{ secrets.PROTO_DEPLOY_KEY != '' }}
        run: |
          version="$(sed -n 's/^version=//p' .proto-version)"
          commit="$(sed -n 's/^commit=//p' .proto-version)"
          if ! echo "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error file=.proto-version::commit must be a full 40-character SHA"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          # The proto repo is private. Secrets are not available to pull
          # requests from forks, so the check is skipped there.
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::PROTO_DEPLOY_KEY is not available; skipping the generated-code check."
          fi
          echo "enabled=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Checkout the pinned protos
        if: steps.pin.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: PrivateJAR/proto
          ref: ${{ steps.pin.outputs.commit }}
          ssh-key: ${{ secrets.PROTO_DEPLOY_KEY }}
          path: .proto-src
          persist-credentials: false

      - name: Setup Buf
        if: steps.pin.outputs.enabled == 'true'
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.74.0"
          github_token: ${{ github.token }}

      - name: Regenerate and compare
        if: steps.pin.outputs.enabled == 'true'
        env:
          PERMIO_PROTO_DIR: ${{ github.workspace }}/.proto-src
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          scripts/generate.sh
          if [ -n "$(git status --porcelain -- src/gen)" ]; then
            git status --short -- src/gen
            git diff --stat -- src/gen
            echo "::error::src/gen/ does not match the protos at ${VERSION} (.proto-version). Run scripts/generate.sh against that proto commit and commit the result."
            exit 1
          fi
          echo "src/gen/ matches the protos at ${VERSION}"
